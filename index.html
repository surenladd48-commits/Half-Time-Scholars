<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Half Time Scholars Podcast</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .tagline {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .player-container {
            margin: 30px 0;
            border-radius: 12px;
            overflow: hidden;
        }
        
        .links {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        
        .link-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .link-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .link-btn.apple {
            background: #FA233B;
        }
        
        .link-btn.apple:hover {
            box-shadow: 0 5px 15px rgba(250, 35, 59, 0.4);
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .links {
                flex-direction: column;
            }
            
            .link-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ Half Time Scholars</h1>
        <p class="tagline">Listen to the latest episodes</p>
        
        <div class="player-container">
            <iframe 
                style="border-radius:12px" 
                src="https://open.spotify.com/embed/show/1NGxHRcn8MWvmcAcbtFPF1?utm_source=generator&theme=0" 
                width="100%" 
                height="450" 
                frameBorder="0" 
                allowfullscreen="" 
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                loading="lazy">
            </iframe>
        </div>
        
        <div class="links">
            <a href="https://open.spotify.com/show/1NGxHRcn8MWvmcAcbtFPF1" class="link-btn" target="_blank">
                🎵 Listen on Spotify
            </a>
            <a href="https://podcasts.apple.com/au/podcast/half-time-scholars/id1493439125" class="link-btn apple" target="_blank">
                🍎 Listen on Apple Podcasts
            </a>
        </div>
    </div>
</body>
</html>
